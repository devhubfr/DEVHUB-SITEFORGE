<title>DevHub — DesignLab &amp; DebugBox</title>
<style>
  :root{
    --bg:#0a0c16; --panel:#11131f; --border:#242841; --border-light:#33385a;
    --violet:#8b5cf6; --magenta:#e0559f; --blue:#4f8cff; --text:#e7e9f7; --muted:#8b91ad;
    --sans:'Sora','Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    display:flex;flex-direction:column;font-family:var(--sans);color:var(--text);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(224,85,159,.13), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(139,92,246,.14), transparent 55%),
      var(--bg);
    overflow:hidden;
  }
  header{
    display:flex;align-items:center;gap:12px;flex-shrink:0;
    padding:10px 18px;border-bottom:1px solid var(--border);
    background:rgba(10,12,22,.7);backdrop-filter:blur(10px);z-index:50;
  }
  #btnMenu{display:none;background:#161a2e;border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:7px 10px;cursor:pointer;font-size:15px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--magenta),var(--violet));
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(224,85,159,.35);font-size:16px;flex-shrink:0;}
  .brand small{color:var(--muted);font-weight:500;font-size:11px;display:block;}

  .shell{flex:1;display:flex;overflow:hidden;position:relative;}

  .catnav{
    width:210px;flex-shrink:0;background:rgba(255,255,255,.015);
    border-right:1px solid var(--border);padding:16px 10px;overflow-y:auto;
  }
  .catnav h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#5f6584;
    margin:4px 6px 10px;font-weight:700;}
  .cat-item{
    display:flex;align-items:center;gap:10px;padding:12px 12px;margin-bottom:6px;
    border-radius:10px;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600;
    border:1px solid transparent;transition:.15s;
  }
  .cat-item .ico{font-size:18px;}
  .cat-item .sub{display:block;font-size:11px;font-weight:400;color:#5f6584;margin-top:1px;}
  .cat-item:hover{background:rgba(224,85,159,.08);color:var(--text);}
  .cat-item.active{background:rgba(224,85,159,.15);color:var(--text);border-color:rgba(224,85,159,.4);
    box-shadow:0 0 16px rgba(224,85,159,.12);}

  .app-frames{flex:1;position:relative;overflow:hidden;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#0a0c16;
    opacity:0;visibility:hidden;transition:opacity .18s ease;}
  iframe.active{opacity:1;visibility:visible;z-index:2;}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;letter-spacing:.03em;z-index:1;}
  .loading::before{content:'';width:14px;height:14px;margin-right:10px;border-radius:50%;
    border:2px solid var(--border-light);border-top-color:var(--magenta);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media(max-width:760px){
    #btnMenu{display:inline-block;}
    .catnav{position:fixed;left:0;top:53px;bottom:0;z-index:60;width:230px;
      transform:translateX(-100%);transition:.2s;background:var(--bg);}
    .catnav.open{transform:translateX(0);}
    .brand small{display:none;}
  }
</style>
</head>

function b64ToUtf8(b64){
  const binStr = atob(b64);
  const bytes = Uint8Array.from(binStr, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

const frames = {
  design: document.getElementById('frame-design'),
  debug: document.getElementById('frame-debug')
};
const loaded = { design:false, debug:false };
const loadingMsg = document.getElementById('loadingMsg');

function ensureLoaded(app){
  if(loaded[app]) return;
  frames[app].srcdoc = b64ToUtf8(SOURCES[app]);
  loaded[app] = true;
}

function showApp(app){
  ensureLoaded(app);
  Object.keys(frames).forEach(k=>{
    frames[k].classList.toggle('active', k===app);
  });
  document.querySelectorAll('.cat-item').forEach(t=>{
    t.classList.toggle('active', t.dataset.app===app);
  });
  loadingMsg.style.display = 'none';
  document.getElementById('catnav').classList.remove('open');
}

document.querySelectorAll('.cat-item').forEach(btn=>{
  btn.addEventListener('click', ()=>showApp(btn.dataset.app));
});
document.getElementById('btnMenu').addEventListener('click', ()=>{
  document.getElementById('catnav').classList.toggle('open');
});

showApp('design');
</script>
</body>
</html>
